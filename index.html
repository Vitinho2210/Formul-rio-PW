<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <section class="card">

            <h1>Calculadora de IMC</h1>
            <p class="descricao">
                Preencha seus dados para calcular seu Índice de Massa Corporal.
            </p>

            <form id="formulario">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input 
                        type="text" 
                        id="nome" 
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input 
                        type="number" 
                        id="peso" 
                        placeholder="Ex: 65"
                        step="0.1"
                        min="0.1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (m)</label>
                    <input 
                        type="number" 
                        id="altura" 
                        placeholder="Ex: 1.75"
                        step="0.01"
                        min="0.1"
                        required
                    >
                </div>

                <button type="submit">
                    Calcular IMC
                </button>

            </form>

            <div id="resultado" class="resultado" aria-live="polite">
            </div>

        </section>

    </main>
        <script src="pageScript.js"></script>
</body>
</html>
